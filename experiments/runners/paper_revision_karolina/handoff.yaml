correctness:
  route_screen:
    - identical state SHA-256 across derivative routes
    - tangent-action comparison at prespecified relative tolerance
    - derivative verification gate already passed for selected degree/rule
    - Tier-B full solves use ksp_rtol 1e-8 and KSP cap 500; loose 1e-2 is forbidden
    - P1(L1), P1(L2), P2(L1), and P4(L1) at ranks 1, 8, and 32
    - ranks 1 and 8 are training; rank 32 is untouched holdout
    - P4(L1) colored SFD is a prespecified non-attempt motivated by pilot memory risk; no threshold is claimed
    - strict analysis reconstructs states/actions before timing admission
    - no predictive model fit until the frozen minimum train/holdout gates pass
  p3d_convergence:
    - all p3d_solve rows use reference_elastic_energy
    - MUMPS inertia numerically checks positive definiteness on the glued free space
    - GMRES/Hypre Riesz solve uses rtol 1e-10, atol 1e-14, and cap 1000
    - independently recomputed Riesz true residual must be at most 1e-8
    - endpoint Riesz RHS must equal both coefficient-gradient diagnostics
    - completed rows must pass the Riesz residual gate
  discretization:
    - terminal status and stopping metrics
    - common fixed-state 24-point/125-point energy and observable evaluation
    - endpoint state comparison across quadrature, mesh, and tolerance blocks
    - mandatory common-rule evaluator failure propagates to the outer row
    - strict six-row adjudicator required before interpretation
  scaling:
    - identical policy and stopping contract at every rank
    - endpoint state, energy, residual, and iteration-count checks
    - per-rank and per-node memory plus Slurm accounting
    - strict HE/optional-P3D separation and post-job accounting snapshot
collection:
  output_root: artifacts/reproduction/paper_revision_karolina/<campaign-id>
  required_files:
